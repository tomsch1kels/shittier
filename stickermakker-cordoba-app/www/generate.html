<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Boek Sticker Generator</title>
  <style>
    :root {
      --bg: #fcf8ef;          /* Achtergrondkleur */
      --surface: #f3eee2;     /* Subtiele tint voor elementen */
      --line: #e2dbcd;        /* Randkleur afgestemd op de achtergrond */
      --text: #1a1a1a;
      --muted: #777777;
      --accent: #5fac57;      /* Voorgrond/Accentkleur */
      --disabled: #bbbbbb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --surface: #1e1e1e;
        --line: #333333;
        --text: #f0f0f0;
        --muted: #9a9a9a;
        --accent: #5fac57;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .topbar__title {
      flex: 1;
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }

    .icon-btn {
      width: 36px; height: 36px;
      border: 0; border-radius: 50%;
      background: transparent;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }

    .topbar__spacer { width: 36px; }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 16px;
      min-height: 0;
    }

    .cta {
      width: 100%;
      max-width: 380px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .cta:disabled {
      background: var(--disabled);
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <button class="icon-btn" id="btn-back" aria-label="Terug">&#8592;</button>
      <h1 class="topbar__title">Boek Sticker Generator</h1>
      <span class="topbar__spacer"></span>
    </header>

    <main class="screen">
        <button class="cta bottom-button" id="btn-continue">Ga door</button>
    </main>

  </div>

  <script src="cordova.js"></script>
  <script src="js/generate.js"></script>
</body>
</html>
