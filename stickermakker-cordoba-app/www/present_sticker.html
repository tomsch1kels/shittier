<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presenteer sticker</title>
  <style>
    :root {
      --bg: #fcf8ef;          /* Achtergrondkleur */
      --surface: #f3eee2;     /* Subtiele tint voor elementen */
      --line: #e2dbcd;        /* Randkleur afgestemd op de achtergrond */
      --text: #1a1a1a;
      --muted: #666666;
      --accent: #5fac57;      /* Voorgrond/Accentkleur */
      --disabled: #cccccc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 80px 20px 40px;
      overflow: auto;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Groep waarin titel en auteur onder elkaar staan */
    .boekInfo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      flex: 0 0 auto;
      text-align: center;
    }

    /* Horizontale tekstvelden - alle rotatie verwijderd */
    #titel, #auteur, #weeknummer, #categoryId, #prijs {
      writing-mode: horizontal-tb;
      transform: none;
      font-size: 24px;
      text-transform: uppercase;
      color: var(--accent);
      margin: 8px 0;
      white-space: nowrap;
    }

    /* Titel: vetgedrukt en het grootst */
    #titel {
      font-size: 32px;
      font-weight: 900;
    }

    /* Auteur: niet vetgedrukt, iets kleiner */
    #auteur {
      font-size: 24px;
      font-weight: 400;
      color: var(--text);
    }

    /* De overige velden blijven vetgedrukt */
    #weeknummer, #categoryId, #prijs {
      font-weight: 900;
      font-size: 20px;
    }

    /* Barcode houder - breedte en hoogte aangepast voor horizontale lay-out */
    #barcodeWrap {
      position: relative;
      flex: 0 0 auto;
      width: 395px;
      height: 185px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    /* Het canvas - geen rotatie meer */
    #barcode {
      position: absolute;
      background: #ffffff;
    }

    #terreg {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 20px;
      font-weight: 600;
      padding: 10px 20px;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    /* Responsieve aanpassingen voor kleinere schermen */
    @media (max-width: 768px) {
      #titel { font-size: 24px; }
      #auteur { font-size: 18px; }
      #weeknummer, #categoryId, #prijs { font-size: 16px; }
      #barcodeWrap { width: 280px; height: 140px; }
    }
  </style>
</head>
<body>

  <div class="boekInfo">
    <p id="titel"></p>
    <p id="auteur"></p>
  </div>
  <p id="weeknummer"></p>
  <p id="categoryId"></p>
  <p id="prijs"></p>
  <div id="barcodeWrap"><canvas id="barcode"></canvas></div>
  <a id="terreg" href="index.html">&larr; Terug</a>

  <script>

    var PATRONEN = [
      "212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
      "221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
      "221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
      "212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
      "231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
      "231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
      "314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
      "112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
      "111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
      "214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
      "114131","311141","411131","211412","211214","211232","2331112"
    ];

    function code128B(tekst) {
      var START_B = 104, STOP = 106;
      var waarden = [];
      var som = START_B;

      for (var i = 0; i < tekst.length; i++) {
        var v = tekst.charCodeAt(i) - 32;
        if (v < 0 || v > 94) continue;
        waarden.push(v);
        som += v * waarden.length;
      }

      waarden.push(som % 103);

      var patroon = PATRONEN[START_B];
      for (var j = 0; j < waarden.length; j++) patroon += PATRONEN[waarden[j]];
      patroon += PATRONEN[STOP];
      return patroon;
    }

    function drawBarcode(canvas, tekst) {
      var patroon = code128B(tekst);

      var moduleBreedte = 2;
      var stilte = 10;
      var balkHoogte = 90;
      var tekstHoogte = 28;

      var aantalModules = stilte * 2;
      for (var i = 0; i < patroon.length; i++) {
        aantalModules += parseInt(patroon.charAt(i), 10);
      }

      var breedte = aantalModules * moduleBreedte;
      var hoogte = balkHoogte + tekstHoogte;

      var dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(breedte * dpr);
      canvas.height = Math.round(hoogte * dpr);
      canvas.style.width = breedte + "px";
      canvas.style.height = hoogte + "px";

      var ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, breedte, hoogte);

      ctx.fillStyle = "#000000";
      var x = stilte * moduleBreedte;
      for (var j = 0; j < patroon.length; j++) {
        var w = parseInt(patroon.charAt(j), 10) * moduleBreedte;
        if (j % 2 === 0) ctx.fillRect(x, 0, w, balkHoogte);
        x += w;
      }

      ctx.font = "bold 20px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(tekst, breedte / 2, balkHoogte + tekstHoogte / 2);
    }

    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    document.addEventListener("DOMContentLoaded", function () {
      var prijs = localStorage.getItem("prijs") || "";
      var categorieId = localStorage.getItem("categorieId") || "";
      var categorieNaam = localStorage.getItem("categorieNaam") || "";
      var titel = localStorage.getItem("titel") || "";
      var auteur = localStorage.getItem("auteur") || "";

      document.getElementById("prijs").textContent = prijs;
      document.getElementById("categoryId").textContent =
        categorieNaam ? categorieId + " (" + categorieNaam + ")" : categorieId;
      document.getElementById("weeknummer").textContent = getWeekNumber(new Date());
      document.getElementById("titel").textContent = titel;
      document.getElementById("auteur").textContent = auteur;

      drawBarcode(document.getElementById("barcode"), "lorem ipsum");
    });

  </script>
</body>
</html>
