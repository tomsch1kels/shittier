<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorie</title>
  <style>
    :root {
      --bg: #fcf8ef;          /* Achtergrondkleur */
      --surface: #f3eee2;     /* Subtiele tint voor elementen */
      --line: #e2dbcd;        /* Randkleur afgestemd op de achtergrond */
      --text: #1a1a1a;
      --muted: #666666;
      --accent: #5fac57;      /* Voorgrond/Accentkleur */
      --disabled: #cccccc;
    }

    * { box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, Roboto, sans-serif; 
      margin: 0; 
      padding: 16px 0 80px; 
      background: var(--bg);
      color: var(--text);
    }
    
    h1 { 
      font-size: 15px; 
      color: var(--muted); 
      margin: 0 16px 8px; 
      font-weight: 500; 
    }
    
    .categorie-lijst { list-style: none; margin: 0; padding: 0; }
    
    .categorie {
      display: block; 
      color: var(--text); 
      font-size: 13px; 
      padding: 10px 16px;
      border-bottom: 1px solid var(--line); 
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    
    .categorie.selected { 
      background: var(--accent); 
      color: #fff; 
    }
    
    .balk { 
      height: 4px; 
      background: var(--line); 
      margin-top: 6px; 
      overflow: hidden; 
    }
    
    .balk-vulling { 
      height: 100%; 
      width: 0; 
      background: var(--accent); 
      transition: width .6s ease; 
    }
    
    .categorie.selected .balk { 
      background: rgba(255,255,255,.3); 
    }
    
    .categorie.selected .balk-vulling { 
      background: #fff; 
    }
    
    .volgende {
      position: fixed; left: 16px; right: 16px; bottom: 16px;
      padding: 14px; border: 0; border-radius: 8px;
      background: var(--accent); 
      color: #fff; 
      font-size: 14px; 
      font-weight: 600;
      cursor: pointer;
    }
    
    .volgende[disabled] { 
      background: var(--disabled); 
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Kies een categorie</h1>
  <ul id="categorieen" class="categorie-lijst"></ul>
  <button id="volgende" class="volgende" disabled>Volgende</button>

  <script>
    var categorieen = {
      1: "Bedrijfskunde & economie",
      4: "Educatief, opvoeding & onderwijs",
      7: "Geschiedenis & koningshuis",
      8: "Gezondheid & geneeskunde",
      9: "Godsdienst & religie",
      10: "Hobby",
      17: "Mens & maatschappij",
      18: "Natuur & milieu",
      20: "Poëzie",
      21: "Romans"
    };

    document.addEventListener("DOMContentLoaded", function () {
      var lijst = document.getElementById("categorieen");
      var knop = document.getElementById("volgende");
      var gekozen = null;

      // Clear bestaande items (als er per ongeluk nog HTML-items staan)
      lijst.innerHTML = '';

      const raw = localStorage.getItem("assessmentResult");
      let assessmentResult = null;
      try { 
        assessmentResult = raw ? JSON.parse(raw) : null; 
      } catch (e) { 
        console.error('Error parsing assessmentResult:', e);
        assessmentResult = null;
      }
        
      if (!assessmentResult || !assessmentResult.jev_result?.answers?.categorie?.probabilities) {
        console.error('Invalid assessmentResult structure');
        alert('Fout: geen probabiliteiten gevonden');
        return;
      }
      
      const probabilities = assessmentResult.jev_result.answers.categorie.probabilities;

      const gesorteerd = Object.entries(probabilities)
        .map(([categorieId, probability]) => ({ categorieId, probability }))
        .sort((a, b) => b.probability - a.probability);

      for (const { categorieId, probability } of gesorteerd) {
        var pct = probability * 100;
        var li = document.createElement("li");
        li.className = "categorie";
        li.dataset.id = categorieId;
        
        // Bouw de structuur via createElement in plaats van innerHTML
        var textDiv = document.createElement("div");
        textDiv.textContent = categorieen[categorieId];
        li.appendChild(textDiv);
        
        var balk = document.createElement("div");
        balk.className = "balk";
        
        var vulling = document.createElement("div");
        vulling.className = "balk-vulling";
        // Set width DIRECT zonder requestAnimationFrame
        vulling.style.width = pct + "%";
        
        balk.appendChild(vulling);
        li.appendChild(balk);

        li.addEventListener("click", function () {
          var oud = lijst.querySelector(".categorie.selected");
          if (oud) oud.classList.remove("selected");
          this.classList.add("selected");
          gekozen = this.dataset.id;
          knop.disabled = false;
        });

        lijst.appendChild(li);

        if (probability > 0.5 && !gekozen) {
          li.classList.add("selected");
          gekozen = categorieId;
          knop.disabled = false;
        }
      }

      knop.addEventListener("click", function () {
        if (!gekozen) return;
        localStorage.setItem("categorieId", gekozen);
        localStorage.setItem("categorieNaam", categorieen[gekozen]);
        window.location.href = "adjust_price.html";
      });
    });
  </script>
</body>
</html>
