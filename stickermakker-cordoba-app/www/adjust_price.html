<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prijs</title>
  <style>
    :root {
      --bg: #fcf8ef;          /* Achtergrondkleur */
      --surface: #f3eee2;     /* Subtiele tint voor elementen */
      --line: #e2dbcd;        /* Randkleur afgestemd op de achtergrond */
      --text: #1a1a1a;
      --muted: #666666;
      --accent: #5fac57;      /* Voorgrond/Accentkleur */
      --disabled: #cccccc;
    }

    * { box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, Roboto, sans-serif; 
      margin: 0; 
      padding: 16px; 
      background: var(--bg);
      color: var(--text);
    }
    
    h1 { 
      font-size: 15px; 
      color: var(--muted); 
      margin: 0 0 4px; 
      font-weight: 500; 
    }
    
    .gekozen { 
      font-size: 13px; 
      color: var(--accent); 
      margin: 0 0 16px; 
    }
    
    .prijs-grid { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      gap: 8px; 
    }
    
    .prijs-vak {
      position: relative; aspect-ratio: 1; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); border-radius: 4px;
      font-size: 12px; color: var(--text); cursor: pointer;
      background: var(--surface);
      -webkit-tap-highlight-color: transparent;
    }
    
    .prijs-vak .vulling {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      background: #e5ede3; transition: width .6s ease; z-index: 0;
    }
    
    .prijs-vak span.label { position: relative; z-index: 1; }
    
    .prijs-vak.selected { 
      border-color: var(--accent); 
      border-width: 2px; 
      color: var(--accent); 
      font-weight: 600; 
    }
    
    .prijs-vak.selected .vulling { 
      background: rgba(95, 172, 87, 0.18); 
    }
    
    .terug { 
      display: inline-block; 
      margin-top: 20px; 
      font-size: 13px; 
      color: var(--accent); 
      text-decoration: none; 
    }
    
    .volgende {
      position: fixed; left: 16px; right: 16px; bottom: 16px;
      padding: 14px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    
    .volgende[disabled] { 
      background: var(--disabled); 
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Kies een prijs</h1>
  <p class="gekozen" id="gekozen"></p>
  <div id="prijsgrid" class="prijs-grid"></div>
  <button id="volgende" class="volgende" disabled>Volgende</button>
  <a class="terug" href="index.html">&larr; Terug</a>

  <script>
    function pctVoor(sleutel) {
      var h = 0, s = String(sleutel);
      for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
      return 20 + (h % 76);
    }

    const raw = localStorage.getItem("assessmentResult");
    let assessmentResult = null;
    try { 
      assessmentResult = raw ? JSON.parse(raw) : null; 
    } catch (e) { 
      console.error('Error parsing assessmentResult:', e);
      assessmentResult = null;
    }
      
    if (!assessmentResult || !assessmentResult.jev_result?.answers?.categorie?.probabilities) {
      console.error('Invalid assessmentResult structure');
      alert('Fout: geen probabiliteiten gevonden');
    }
    
    const probabilities = assessmentResult.jev_result.answers.verkoopprijs.probabilities;


    document.addEventListener("DOMContentLoaded", function () {
      var naam = localStorage.getItem("categorieNaam");
      document.getElementById("gekozen").textContent = naam ? "Categorie: " + naam : "";
      var knop = document.getElementById("volgende");

      var grid = document.getElementById("prijsgrid");

      for (var i = 1; i <= 10; i++) {
        var bedrag = (i * 0.5).toFixed(2);
        var pct = probabilities[i-1]*100;

        var vak = document.createElement("div");
        vak.className = "prijs-vak";
        vak.dataset.prijs = bedrag;
        vak.innerHTML =
          '<div class="vulling"></div>' +
          '<span class="label">&euro;' + bedrag.replace(".", ",") + "</span>";

        vak.addEventListener("click", function () {
          var oud = grid.querySelector(".prijs-vak.selected");
          if (oud) oud.classList.remove("selected");
          this.classList.add("selected");
          localStorage.setItem("prijs", this.dataset.prijs);
          knop.disabled = false;
        });

        grid.appendChild(vak);
        (function (v, p) {
          requestAnimationFrame(function () {
            v.querySelector(".vulling").style.width = p + "%";
          });
        })(vak, pct); 
      }

      knop.addEventListener("click", function () {
        if (!gekozen) return;
        window.location.href = "present_sticker.html";
      });
    });
  </script>
</body>
</html>
