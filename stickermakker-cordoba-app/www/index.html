<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StickerMakker</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(180deg, #f5f0e1 0%, #e8e0d0 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 1000px;
      padding: 24px;
    }

    /* Logo afbeeldingen */
    img {
      display: block;
      max-width: 100%;
      max-height: 70px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(60, 80, 50, 0.25));
      transition: transform 0.2s ease;
    }

    /* Active state voor touch in plaats van hover */
    img:active {
      transform: scale(0.95);
      filter: drop-shadow(0 2px 6px rgba(60, 80, 50, 0.15));
    }

    /* RataPlan logo 30% kleiner */
    img[src*="RataPlan"] {
      max-height: 49px;  /* 70px × 0.7 = 30% kleiner */
    }

    /* Collaboratie kruisen - krachtig groen */
    .times {
      font-weight: 900;
      font-size: 40px;
      color: #2e7d32;
      text-shadow: 
        0 0 8px rgba(46, 125, 50, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.3);
      line-height: 1;
      margin: 0;
      padding: 0 8px;
    }

    /* Presents tekst - zelfde groene stijl maar kleiner */
    .presents {
      font-weight: 900;
      font-size: 16px;
      color: #388e3c;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 
        0 1px 4px rgba(56, 142, 60, 0.5),
        0 2px 6px rgba(0, 0, 0, 0.3);
      line-height: 1;
      margin: 0;
      margin-top: -4px;
      margin-bottom: -4px;
      position: relative;
    }

    .presents::before,
    .presents::after {
      content: '◆';
      position: absolute;
      color: #388e3c;
      font-size: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    .presents::before {
      left: -20px;
    }

    .presents::after {
      right: -20px;
    }

    /* Responsive voor smartphones - 100% breder */
    @media (max-width: 768px) {
      body {
        gap: 16px;
        padding: 0;
      }

      .container {
        gap: 18px;
        padding: 20px;
        max-width: 100%;
      }

      img {
        max-height: 80px;
      }

      /* RataPlan op smartphones ook 30% kleiner */
      img[src*="RataPlan"] {
        max-height: 56px;  /* 80px × 0.7 */
      }

      .times {
        font-size: 32px;
      }

      .presents {
        font-size: 14px;
        letter-spacing: 3px;
        margin-top: -3px;
        margin-bottom: -3px;
      }

      .presents::before,
      .presents::after {
        font-size: 11px;
      }
    }

    /* Extra kleine schermen */
    @media (max-width: 480px) {
      .container {
        gap: 14px;
        padding: 16px;
      }

      img {
        max-height: 65px;
      }

      img[src*="RataPlan"] {
        max-height: 45px;  /* 65px × 0.7 */
      }

      .times {
        font-size: 28px;
      }

      .presents {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .presents::before,
      .presents::after {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="img/doelDelflandLogo.jpeg" alt="Doel Delfland logo">
    <p class="times">×</p>
    <img src="img/RataPlan-logo-header.webp" alt="RataPlan logo">
    <p class="times">×</p>
    <img src="img/lumoLogo.png" alt="Lumo logo">
    <p class="presents">PRESENTEERT</p>
    <img src="img/logo.jpeg" alt="StickerMakker logo">
    <button href="take_photo.html">Begin</button>
  </div>
</body>
</html>
