<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StickerMakker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(180deg, #fcf8ef 0%, #fcf8ef 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      position: relative;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 1000px;
      min-height: 100vh;
      padding: 24px;
      /* ruimte onderaan voor de vaste Seq. Diag knop */
      padding-bottom: 92px;
    }

    /* Logogroep: groeit mee en blijft verticaal gecentreerd,
       zodat de Begin-knop onderaan de pagina plakt */
    .logos {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    /* Logo afbeeldingen */
    img {
      display: block;
      max-width: 100%;
      max-height: 70px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(60, 80, 50, 0.25));
      transition: transform 0.2s ease;
    }

    /* Active state voor touch in plaats van hover */
    img:active {
      transform: scale(0.95);
      filter: drop-shadow(0 2px 6px rgba(60, 80, 50, 0.15));
    }

    /* RataPlan logo 30% kleiner */
    img[src*="RataPlan"] {
      max-height: 49px;  /* 70px × 0.7 = 30% kleiner */
    }

    /* Collaboratie kruisen - nieuw groen #5fac57 */
    .times {
      font-weight: 900;
      font-size: 40px;
      color: #5fac57;
      text-shadow: 
        0 0 8px rgba(95, 172, 87, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.3);
      line-height: 1;
      margin: 0;
      padding: 0 8px;
    }

    /* Presents tekst - nieuw groen #5fac57 */
    .presents {
      font-weight: 900;
      font-size: 16px;
      color: #5fac57;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 
        0 1px 4px rgba(95, 172, 87, 0.5),
        0 2px 6px rgba(0, 0, 0, 0.3);
      line-height: 1;
      margin: 0;
      margin-top: -4px;
      margin-bottom: -4px;
      position: relative;
    }

    .presents::before,
    .presents::after {
      content: '◆';
      position: absolute;
      color: #5fac57;
      font-size: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    .presents::before {
      left: -20px;
    }

    .presents::after {
      right: -20px;
    }

    /* Grote Begin-knop onderaan - nieuw groen #5fac57 */
    .begin-btn {
      display: block;
      width: 100%;
      margin: 0;
      padding: 22px 24px;
      background-color: #5fac57;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .begin-btn:active {
      transform: scale(0.98);
      background-color: #4a9c43;
    }

    /* Vaste knop rechtsonder voor het sequence diagram - nieuw groen #5fac57 */
    .seq-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #5fac57;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 100;
      transition: background 0.2s, transform 0.1s;
    }

    .seq-btn:active {
      transform: scale(0.95);
      background-color: #4a9c43;
    }

    /* Modal pop-up overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 90%;
      max-height: 90vh;
      overflow: auto;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      text-align: center;
    }

    .modal-content img {
      max-width: 100%;
      height: auto;
      max-height: 75vh;
      margin: 0 auto;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      color: #333;
    }

    /* Responsive voor smartphones - 100% breder */
    @media (max-width: 768px) {
      body {
        gap: 16px;
        padding: 0;
      }

      .container {
        gap: 18px;
        padding: 20px;
        padding-bottom: 78px;
        max-width: 100%;
      }

      .logos {
        gap: 18px;
      }

      img {
        max-height: 80px;
      }

      /* RataPlan op smartphones ook 30% kleiner */
      img[src*="RataPlan"] {
        max-height: 56px;  /* 80px × 0.7 */
      }

      .times {
        font-size: 32px;
      }

      .presents {
        font-size: 14px;
        letter-spacing: 3px;
        margin-top: -3px;
        margin-bottom: -3px;
      }

      .presents::before,
      .presents::after {
        font-size: 11px;
      }

      .begin-btn {
        padding: 20px 20px;
        font-size: 23px;
      }

      .seq-btn {
        bottom: 12px;
        right: 12px;
        padding: 8px 12px;
        font-size: 12px;
      }
    }

    /* Extra kleine schermen */
    @media (max-width: 480px) {
      .container {
        gap: 14px;
        padding: 16px;
        padding-bottom: 66px;
      }

      .logos {
        gap: 14px;
      }

      img {
        max-height: 65px;
      }

      img[src*="RataPlan"] {
        max-height: 45px;  /* 65px × 0.7 */
      }

      .times {
        font-size: 28px;
      }

      .presents {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .presents::before,
      .presents::after {
        display: none;
      }

      .begin-btn {
        padding: 18px 16px;
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logos">
      <img src="img/doelDelflandLogo.jpeg" alt="Doel Delfland logo">
      <p class="times">×</p>
      <img src="img/RataPlan-logo-header.webp" alt="RataPlan logo">
      <p class="times">×</p>
      <img src="img/lumoLogo.png" alt="Lumo logo">
      <p class="presents">PRESENTEERT</p>
      <img src="img/logo.jpeg" alt="StickerMakker logo">
    </div>

    <a href="take_photo.html" class="begin-btn">Begin</a>
  </div>

  <!-- Vaste knop in de hoek rechtsonder -->
  <button class="seq-btn" onclick="openModal()">Seq. Diag</button>

  <!-- Pop-up overlay met het diagram -->
  <div id="seqModal" class="modal-overlay" onclick="closeModalOnOutside(event)">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <h3 style="margin-top: 0; color: #5fac57; font-size: 16px;">Sequence Diagram</h3>
      <img src="img/sequence-diagram.png" alt="Sequence Diagram">
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('seqModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('seqModal').style.display = 'none';
    }

    function closeModalOnOutside(event) {
      if (event.target === document.getElementById('seqModal')) {
        closeModal();
      }
    }
  </script>
</body>
</html>
